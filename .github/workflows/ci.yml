name: CI

on:
  push:
  pull_request:

# Credenciales efímeras: se derivan del identificador de cada ejecución y no quedan en el repositorio.
env:
  DB_HOST: 127.0.0.1
  DB_NAME: bd_rrhh
  DB_USER: root
  DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
  SECRET_KEY: ci-${{ github.run_id }}-${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bd_rrhh
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Dependencias de Python
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: pytest --cov --cov-report=term-missing
